# ---- QM/MM, embedding, ligands and synthesis -------------------------------------
# Electrostatic QM/MM single point (OpenMM system + PySCF QM region). The CASCI region is
# solved by exact FCI (CPU or GPU) or by SQD (statevector, noisy Aer or GPU sampler); GPU
# placement needs a GPU solver or sampler (qcl-check).
["qmmm.energy"]
kind = "compute"
output = "estimate"
devices = ["cpu", "gpu"]
relation = "param"
relation_param = "scheme"
relations = { rhf = "variational_upper_bound", "casci/fci" = "equivalent", "casci/gpu_fci" = "equivalent", "casci/sqd" = "variational_upper_bound" }

# Embedded RHF of a QM region in the MM point charges; its active spaces carry the
# residual MM energy, so active-space solvers return QM/MM totals.
["qmmm.scf"]
kind = "compute"
output = "scf_result"
devices = ["cpu"]
relation = "variational_upper_bound"

# Embedded wave-function theory over atomic fragments. Only the full bath with an FCI
# fragment solver reproduces the full-space exact energy.
["embedding.ewf"]
kind = "compute"
output = "estimate"
devices = ["cpu"]
relation = "param"
relation_param = "scheme"
relations = { "full/fci" = "equivalent", "full/ccsd" = "approximate", "dmet/fci" = "approximate", "dmet/ccsd" = "approximate", "bno/fci" = "approximate", "bno/ccsd" = "approximate" }

