# ---- spectral functions ------------------------------------------------------------
# Lehmann spectral function from Rayleigh-Ritz spectra in sampled (configuration
# recovery) or full determinant subspaces of the N and N±1 sectors.
["dynamics.spectral_subspace"]
kind = "compute"
output = "spectral_estimate"
devices = ["cpu"]
relation = "param"
relation_param = "subspace"
relations = { full = "equivalent", sampled = "approximate" }
