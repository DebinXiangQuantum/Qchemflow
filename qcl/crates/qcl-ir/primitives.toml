# QCL primitive table: the single declaration of every operation the IR can contain.
#
# Each entry is keyed by the IR op name and declares:
#   kind     host | compute | projection | copy                      (NodeKind)
#   output   the produced ValueType, or "input" when it is an input's type
#   output_from
#            which input supplies an "input" output type (default 0)
#   devices  device kinds that have a registered implementation (compute ops only).
#            The checker reports QCL-E203 for any other kind; conditional limits
#            (open-shell GPU SCF, the native CI engine, same-GPU densities, ...)
#            stay as explicit rules in qcl-check.
#   axis     the parallel axis an implementation splits a device list along
#   message, hint
#            optional QCL-E203 wording; the default is
#            "<op> has no <kind> implementation" / "Available device kinds: ..."
#
# Adding an operation: declare it here, add the frontend function that builds the
# node, and register a worker handler with @implements("<op>") in qcl/_impls/.
# qcl/tests/test_primitives.py fails if the three disagree.

# ---- host: molecules, checks, control flow and constructions --------------------
