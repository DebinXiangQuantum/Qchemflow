name: QCL and ChemFlow CPU tests

on:
  push:
    paths:
      - .github/workflows/qcl.yml
      - pyproject.toml
      - qcl/**
      - src/**
      - tests/**
      - formal/**
      - evidence/**
      - benchmarks/results/**
      - examples/**
      - plugin/**
  pull_request:
    paths:
      - .github/workflows/qcl.yml
      - pyproject.toml
      - qcl/**
      - src/**
      - tests/**
      - formal/**
      - evidence/**
      - benchmarks/results/**
      - examples/**
      - plugin/**

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e '.[quantum,reactivity,paths,mcp,llm,openai]' pytest ruff maturin
      - run: cargo fmt --all --check
        working-directory: qcl
      - run: PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" cargo test --workspace --locked
        working-directory: qcl
      - run: VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --manifest-path qcl/Cargo.toml
      - run: .venv/bin/ruff check src tests qcl/python qcl/tests qcl/apps
      - run: OMP_NUM_THREADS=1 .venv/bin/python -m pytest qcl/tests tests -q
