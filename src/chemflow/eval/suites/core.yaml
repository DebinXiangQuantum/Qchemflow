- id: hcn-hnc-enthalpy
  category: thermo
  spec:
    question: Evaluate HCN to HNC isomerization enthalpy at 298.15 K
    target:
      kind: reaction_energy
      electronic_model: *id001
      species:
      - name: HCN
        molecule:
          atoms: H 0 0 -1.065; C 0 0 0; N 0 0 1.156
        coefficient: -1
        active:
          n_elec: 4
          n_orb: 4
        sector:
          n_alpha: 2
          n_beta: 2
          n_orb: 4
        target_spin: 0
      - name: HNC
        molecule:
          atoms: H 0 0 -0.995; N 0 0 0; C 0 0 1.170
        coefficient: 1
        active:
          n_elec: 4
          n_orb: 4
        sector:
          n_alpha: 2
          n_beta: 2
          n_orb: 4
        target_spin: 0
      thermo:
        quantity: enthalpy
        temperature_K: 298.15
        pressure_Pa: 101325
    gates:
    - kind: abs_error_vs_exact
      threshold: 0.0016
      unit: hartree
    - kind: relation_at_least
      relation: approximate
    budget:
      wall_s: 180
      sim_shots: 100000
      qpu_s: 0
      qpu_shots: 0
    allowed_effects:
    - pure
    - simulator
    decision: Choose a supported method without changing the signed target
  expected:
    value_hartree: 0.09430291605178809
    decision_in:
    - stop
    - escalate
  reference_source: Direct PySCF RHF/STO-3G with independent scipy Nelder-Mead minimization
    of both linear bond lengths; analytic PySCF Hessian and harmonic_analysis; canonical-HF
    CASCI(4e,4o), five frozen occupied orbitals. Independent ideal-gas RRHO enthalpy
    7kT/2 plus harmonic vibrational energy including ZPE; HNC minus HCN at 298.15
    K. The 1e-6 Ha tolerance accommodates independent geometry minimization and active-space
    orbital sensitivity. Recompute with scripts/eval_reference_values.py; no ChemFlow
    pipeline calls.
