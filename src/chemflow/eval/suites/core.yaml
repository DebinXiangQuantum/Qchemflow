- id: h2-atomization
  category: reaction
  spec:
    question: Evaluate h2-atomization against classical controls
    target:
      kind: reaction_energy
      electronic_model: &id001
        basis: sto-3g
      species:
      - name: H2
        molecule:
          atoms: H 0 0 0; H 0 0 0.74
        coefficient: -1
        active:
          n_elec: 2
          n_orb: 2
        sector:
          n_alpha: 1
          n_beta: 1
          n_orb: 2
        target_spin: 0
      - name: H
        molecule:
          atoms: H 0 0 0
          spin: 1
        coefficient: 2
        active:
          n_elec: 1
          n_orb: 1
        sector:
          n_alpha: 1
          n_beta: 0
          n_orb: 1
        target_spin: 0.5
    gates:
    - kind: abs_error_vs_exact
      threshold: 0.0016
      unit: hartree
    - kind: relation_at_least
      relation: approximate
    budget:
      wall_s: 180
      sim_shots: 100000
      qpu_s: 0
      qpu_shots: 0
    allowed_effects:
    - pure
    - simulator
    decision: Choose a supported method without changing the signed target
  expected:
    value_hartree: 0.20412013537395146
    decision_in:
    - stop
    - escalate
  reference_source: 'Direct PySCF: twice isolated spin-1 H UHF/FCI minus H2 RHF/FCI
    at 0.74 angstrom, STO-3G. Recompute with scripts/eval_reference_values.py.'
- id: hubbard-ring6
  category: lattice
  spec:
    question: Evaluate a six-site half-filled Hubbard ring
    target:
      kind: lattice_ground_energy
      lattice:
        model: hubbard
        geometry: ring
        n_sites: 6
        t: 1.0
        U: 4.0
        unit: hartree
      sector:
        n_alpha: 3
        n_beta: 3
        n_orb: 6
      target_spin: 0
    gates:
    - kind: abs_error_vs_exact
      threshold: 0.0016
      unit: hartree
    - kind: relation_at_least
      relation: variational_upper_bound
    budget:
      wall_s: 180
      sim_shots: 100000
      qpu_s: 0
      qpu_shots: 0
    allowed_effects:
    - pure
    - simulator
    decision: Choose a supported method without changing the signed target
  expected:
    value_hartree: -3.668706178872962
    decision_in:
    - stop
    - escalate
  reference_source: Independent 400x400 dense Fock-sector Hubbard ring Hamiltonian,
    six sites, 3 alpha/3 beta electrons, t=1 and U=4 hartree, periodic nearest-neighbor
    hopping. Recompute with scripts/eval_reference_values.py; no ChemFlow operators.
- id: impurity-spectral
  category: spectral
  spec:
    question: Evaluate impurity-spectral against classical controls
    target:
      kind: spectral_function
      model:
        impurity_model:
          U: 2.0
          eps_bath:
          - 0.0
          t_bath:
          - 0.5
          unit: hartree
      sector:
        n_alpha: 1
        n_beta: 1
        n_orb: 2
      orbital: 0
      spin: alpha
      omega:
        start: -4.0
        stop: 4.0
        n: 101
        unit: hartree
      eta: 0.1
    gates:
    - kind: l1_error_vs_exact
      threshold: 0.1
      unit: dimensionless
    - kind: relation_at_least
      relation: equivalent
    budget:
      wall_s: 180
      sim_shots: 100000
      qpu_s: 0
      qpu_shots: 0
    allowed_effects:
    - pure
    - simulator
    decision: Choose a supported method without changing the signed target
  expected:
    value_hartree: 0.9829844062427656
    decision_in:
    - stop
    - escalate
  reference_source: Independent 16x16 full-Fock Jordan-Wigner dense diagonalization
    and Lehmann sum. The legacy value_hartree field is the DIMENSIONLESS trapezoidal
    integral of impurity alpha A(omega) over the declared 101-point [-4,4] hartree
    grid, eta=0.1; not an energy or infinite-window sum rule. Scored against the reference
    result database sum_rule. Recompute with scripts/eval_reference_values.py.
- id: h2-counterpoise
  category: interaction
