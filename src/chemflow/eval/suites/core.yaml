name: core
tasks:
- id: h2-ground
  category: molecular
  spec:
    question: Evaluate h2-ground against classical controls
    target:
      kind: molecular_ground_energy
      molecule:
        atoms: H 0 0 0; H 0 0 0.74
      electronic_model:
        basis: sto-3g
      active:
        n_elec: 2
        n_orb: 2
      sector:
        n_alpha: 1
        n_beta: 1
        n_orb: 2
      target_spin: 0
    gates:
    - kind: abs_error_vs_exact
      threshold: 0.0016
      unit: hartree
    - kind: relation_at_least
      relation: variational_upper_bound
    budget:
      wall_s: 180
      sim_shots: 100000
      qpu_s: 0
      qpu_shots: 0
    allowed_effects:
    - pure
    - simulator
    decision: Choose a supported method without changing the signed target
  expected:
    value_hartree: -1.137283834488502
    decision_in:
    - stop
    - escalate
  reference_source: Direct PySCF RHF then FCI, H2 at 0.74 angstrom, STO-3G, 2e/2o
    singlet. Recompute with scripts/eval_reference_values.py.
