name: full
tasks:
- id: h2-equilibrium
  category: molecular
  spec:
    question: Evaluate h2-equilibrium; preserve the signed model and accuracy gates
    target:
      kind: molecular_ground_energy
      molecule:
        atoms: H 0 0 0; H 0 0 0.74
        spin: 0
        charge: 0
      electronic_model:
        basis: sto-3g
        reference: RHF
      active:
        n_elec: 2
        n_orb: 2
      sector:
        n_alpha: 1
        n_beta: 1
        n_orb: 2
      target_spin: 0.0
    gates:
    - kind: abs_error_vs_exact
      threshold: 0.0016
      unit: hartree
    - kind: relation_at_least
      relation: variational_upper_bound
    budget:
      wall_s: 600
      sim_shots: 100000
      qpu_s: 0
      qpu_shots: 0
    allowed_effects:
    - pure
    - simulator
    decision: Choose a supported method without changing the signed target
  expected:
    value_hartree: -1.137283834488502
    decision_in:
    - stop
    - escalate
  reference_source: 'Direct PySCF RHF/ROHF canonical-orbital CASCI with the declared active electrons/orbitals;
    (total-active electrons)/2 frozen occupied orbitals. Full spaces equal FCI. Recompute: scripts/eval_reference_values.py
    --suite full. No ChemFlow pipeline calls.'
